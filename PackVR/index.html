<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Card Binder AR: pack opening</title>
<style>
  :root { color-scheme: dark; }
  html, body { margin: 0; height: 100%; background: radial-gradient(ellipse at 50% 30%, #2a2740, #0a0a10 70%); font-family: system-ui, sans-serif; color: #f0f0f8; overflow: hidden; }
  canvas#gl { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
  #menu { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; padding: 16px; box-sizing: border-box; }
  .card { width: min(560px, 100%); background: rgba(24, 22, 36, 0.92); border: 1px solid rgba(255,255,255,0.12); border-radius: 24px; padding: 24px; box-shadow: 0 20px 60px rgba(0,0,0,0.5); }
  h1 { margin: 0 0 4px; font-size: 26px; }
  p { margin: 4px 0 14px; color: #b8b8c8; line-height: 1.4; }
  input[type=search] { width: 100%; box-sizing: border-box; padding: 12px 14px; border-radius: 12px; border: 1px solid #44405a; background: #14121e; color: #fff; font-size: 16px; }
  select { width: 100%; margin-top: 8px; padding: 8px; border-radius: 12px; border: 1px solid #44405a; background: #14121e; color: #fff; font-size: 16px; }
  .row { display: flex; gap: 10px; margin-top: 14px; flex-wrap: wrap; }
  button { flex: 1; min-width: 160px; padding: 16px; border-radius: 16px; border: 0; font-size: 18px; font-weight: 700; cursor: pointer; }
  button.primary { background: linear-gradient(135deg, #ffcd50, #ff78dc); color: #1a1226; }
  button.secondary { background: #2e2a44; color: #e8e8f4; }
  button:disabled { opacity: 0.4; cursor: default; }
  #status, #arNote { font-size: 14px; color: #a8a8c0; margin-top: 10px; min-height: 18px; }
  label.mute { font-size: 14px; color: #b8b8c8; display: inline-flex; gap: 8px; align-items: center; margin-top: 12px; }
</style>
<script type="importmap">{ "imports": { "three": "./vendor/three.module.js" } }</script>
</head>
<body>
<canvas id="gl"></canvas>
<div id="menu">
  <div class="card">
    <h1>Card Binder AR</h1>
    <p>Pick a set, then put on the headset view: packs float in front of you. Pinch the top edge of a pack and drag across to tear it open.</p>
    <input id="filter" type="search" placeholder="Search sets" autocomplete="off">
    <select id="setList" size="7" aria-label="Set"></select>
    <div class="row">
      <button id="enterAR" class="primary" disabled>Enter AR</button>
      <button id="flat" class="secondary">Preview on screen</button>
    </div>
    <label class="mute"><input id="mute" type="checkbox"> Mute sounds</label>
    <div id="status"></div>
    <div id="arNote"></div>
  </div>
</div>
<script type="module" src="./js/main.js"></script>
</body>
</html>
